<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feature Preview</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font-family: system-ui, sans-serif; background: #0b1020; color: #f8fafc; }
    main { max-width: 680px; padding: 40px; border: 1px solid rgba(255,255,255,.12); border-radius: 24px; background: rgba(255,255,255,.04); text-align: center; }
    h1 { margin: 0 0 16px; font-size: clamp(2rem, 6vw, 3.5rem); }
    p { color: #cbd5e1; line-height: 1.7; }
    a { display: inline-block; margin-top: 16px; padding: 12px 18px; border-radius: 999px; background: #fff; color: #0b1020; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>No new feature yet</h1>
    <p>There is currently no active feature preview. The latest feature has already been deployed to the main application.</p>
    <a href="/nuxt-app/">Open the main app</a>
  </main>
</body>
</html>

name: Deploy Feature Preview

on:
  push:
    branches:
      - 'feat/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Feature branch to preview'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: 22

concurrency:
  group: github-pages-deployment
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install feature dependencies
        run: npm ci

      - name: Prepare feature Nuxt
        run: npx nuxt prepare

      - name: Generate feature preview
        env:
          NUXT_APP_BASE_URL: /nuxt-app/preview/
        run: npm run generate

      - name: Save feature output
        run: cp -a .output/public /tmp/feature-public

      - name: Checkout main for production build
        run: |
          git fetch origin main
          git worktree add ../production origin/main

      - name: Install production dependencies
        working-directory: ../production
        run: npm ci

      - name: Prepare production Nuxt
        working-directory: ../production
        run: npx nuxt prepare

      - name: Generate production site
        working-directory: ../production
        env:
          NUXT_APP_BASE_URL: /nuxt-app/
        run: npm run generate

      - name: Combine production and feature preview
        run: |
          rm -rf site
          mkdir -p site/preview
          cp -a ../production/.output/public/. site/
          cp -a /tmp/feature-public/. site/preview/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Preview summary
        run: |
          echo "## Feature Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Preview:** \`${{ steps.deployment.outputs.page_url }}preview/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This feature uses the shared preview URL. The production site is rebuilt from main before the feature overlay is published." >> "$GITHUB_STEP_SUMMARY"
